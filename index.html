<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<title>La Nave: menú</title>
<meta name="description" content="Menú y precios de La Nave, comidas en los balnearios Alicante y San Sebastián, La Perla, Mar del Plata.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&family=Fredoka:wght@600&display=swap" rel="stylesheet">
<style>
/* La carta va siempre en claro */
:root{
  --celeste:#95B6DE; --ocre:#E2B865; --crema:#FFFCEA; --hoja:#FFFFFF; --destacado:#FBF4E2;
  --ink:#0C3965; --muted:#56637C; --rule:#8A9BBA; --hair:#E4DFC8;
  color-scheme:only light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 54px)}
@media (prefers-reduced-motion:no-preference){html:focus-within{scroll-behavior:smooth}}
body{margin:0;background:var(--crema);color:var(--ink);font-family:"Barlow",system-ui,sans-serif;font-size:15px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--crema)}
a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}

/* portada */
.cover{min-height:100svh;display:flex;flex-direction:column;background:#FFFFFF}
.cover-top{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:48px 20px 36px;background:#FFFFFF}
.cover h1{margin:0;width:min(300px,74vw);line-height:0}
.cover h1 img{width:100%;height:auto;display:block}
.cover-stripes{flex:0 0 38svh;min-height:220px;position:relative;background:repeating-linear-gradient(90deg,var(--celeste) 0 30px,#FFFFFF 30px 60px)}
.cover .down{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.cover .down span{background:var(--crema);font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.2em;font-size:13px;padding:6px 14px;border-radius:999px;white-space:nowrap}
.cover .down svg{width:26px;height:26px;background:var(--crema);border-radius:999px;padding:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* pestañas */
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--crema);border-bottom:1px solid var(--hair)}
.tabs{position:relative;display:flex;gap:22px;overflow-x:auto;padding:0 20px;max-width:640px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:0 0 auto;min-height:48px;display:inline-flex;align-items:center;color:var(--muted);text-decoration:none;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:15px;letter-spacing:.12em;text-transform:uppercase;border-bottom:2px solid transparent}
.tabs a[aria-current="true"]{color:var(--ink);border-bottom-color:var(--ink)}

/* hojas */
main{max-width:620px;margin:0 auto;padding:18px 0 6px}
.sheet{background:var(--hoja);margin:0 0 18px;overflow:hidden}
.sheet::before{content:"";display:block;height:48px;background:repeating-linear-gradient(90deg,var(--celeste) 0 30px,transparent 30px 60px)}
.sheet .in{padding:6px 22px 40px}
@media (min-width:640px){.sheet .in{padding:14px 40px 48px}}
section{padding-top:36px}
h2{margin:0 0 16px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:22px;line-height:1.1;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
h2.round{font-family:"Fredoka","Barlow Condensed",sans-serif;font-weight:600;font-size:34px;letter-spacing:.02em}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;column-gap:12px;align-items:end;padding:8px 0 7px;border-bottom:1.5px solid var(--rule)}
.row h3,.group h3{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:17px;line-height:1.2;color:var(--ink)}
.row p,.group > p{margin:1px 0 0;font-size:13px;line-height:1.3;color:var(--muted)}
.row.grande h3{font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase}
.size{font-size:12.5px;color:var(--muted);white-space:nowrap;padding-bottom:2px}
.price{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;line-height:1.2;color:var(--ink);white-space:nowrap;text-align:right}
.price.ask{font-weight:500;font-size:15px;color:var(--muted)}
.group{padding-top:12px}
.group > p{margin-bottom:2px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;column-gap:12px;align-items:baseline;padding:6px 0 5px 14px;border-bottom:1.5px solid var(--rule)}
.vrow .l{font-size:14.5px;color:var(--ink)}
.vrow .l small{display:block;font-size:12px;color:var(--muted)}
.note{margin:14px 0 0;font-size:13px;line-height:1.35;color:var(--muted)}
/* destacados con franjas ocres (Tortuguita, Ensalada de frutas) */
.feature{margin:14px -22px 6px;background:var(--destacado)}
@media (min-width:640px){.feature{margin:14px -40px 6px}}
.feature::before,.feature::after{content:"";display:block;height:22px;background:repeating-linear-gradient(90deg,transparent 0 30px,var(--ocre) 30px 90px)}
.feature .row{margin:0 22px;padding:14px 0 12px}
@media (min-width:640px){.feature .row{margin:0 40px}}
.feature .row h3{font-family:"Barlow",sans-serif;font-weight:500;font-size:22px}
/* reposeras al pie de promociones */
.chairs{display:block;width:100%;height:auto;margin-top:26px;aspect-ratio:780/640}
.sheet.promo .in{padding-bottom:0}

footer{text-align:center;color:var(--muted);font-size:13px;padding:22px 20px 46px}
footer img{width:58px;height:auto;display:block;margin:0 auto 16px}
.order{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 24px;margin:0 0 18px;border-radius:999px;background:var(--ink);color:var(--crema);font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:17px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none}
.order svg{width:20px;height:20px}
footer p{margin:3px 0}
</style>
</head>

const el=(t,c,x)=>{const e=document.createElement(t); if(c) e.className=c; if(x!=null) e.textContent=x; return e;};
const byId=Object.fromEntries(MENU.map(s=>[s.id,s]));
const main=document.getElementById('carta'), tabs=document.getElementById('tabs');
const price=p=>el('span',p?'price':'price ask',p||'Consultá');
function single(it){const r=el('div','row'+(it.grande?' grande':'')); const a=el('div'); a.appendChild(el('h3','',it.n)); if(it.d) a.appendChild(el('p','',it.d)); r.appendChild(a);
  r.appendChild(el('span','size',it.s||'')); r.appendChild(price(it.p));
  if(it.destacado){const f=el('div','feature'); f.appendChild(r); return f;} return r;}
function group(it){const g=el('div','group'); g.appendChild(el('h3','',it.n)); if(it.d) g.appendChild(el('p','',it.d));
  for(const [l,p,d,s] of it.v){const r=el('div','vrow'); const lab=el('span','l',l); if(d) lab.appendChild(el('small','',d)); r.appendChild(lab);
    r.appendChild(el('span','size',s||'')); r.appendChild(price(p)); g.appendChild(r);} return g;}
for(const ids of SHEETS){
  const sh=el('div','sheet'+(ids[0]==='promociones'?' promo':'')); const inn=el('div','in'); sh.appendChild(inn);
  for(const id of ids){ const s=byId[id]; if(!s) continue;
    const sec=el('section'); sec.id=s.id; sec.appendChild(el('h2',s.round?'round':'',s.t));
    const a=el('a','',s.t); a.href='#'+s.id; tabs.appendChild(a);
    s.items.forEach(it=>sec.appendChild(it.v?group(it):single(it)));
    if(s.note) sec.appendChild(el('p','note',s.note));
    inn.appendChild(sec);}
  if(ids[0]==='promociones'){const im=el('img','chairs'); im.src=CHAIRS; im.alt=''; im.width=780; im.height=640; sh.appendChild(im);}
  main.appendChild(sh);
}
const links=[...tabs.querySelectorAll('a')]; let active=null;
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(!e.isIntersecting) return;
  const l=links.find(l=>l.getAttribute('href')==='#'+e.target.id); if(!l||l===active) return;
  if(active) active.removeAttribute('aria-current'); l.setAttribute('aria-current','true'); active=l;
  tabs.scrollTo({left:l.offsetLeft-(tabs.clientWidth-l.offsetWidth)/2});}),{rootMargin:'-25% 0px -70% 0px'});
document.querySelectorAll('section[id]').forEach(s=>io.observe(s));
</script>
